<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ayansh Medical Hall</title>
<meta name="description" content="Ayansh Medical Hall — generic medicines trading. Site under construction." />
<link rel="icon" href="assets/logo.png" type="image/png" />
<style>
  :root {
    --deep-teal: #0f3d3e;
    --leaf-green: #2f8f3e;
    --accent-orange: #e8792b;
    --bg: #f7f9f8;
    --card-bg: #ffffff;
    --text: #16211f;
    --muted: #5b6b67;
    --border: #e2e8e5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, #eef3f0 100%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    max-width: 560px;
    width: 100%;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(15, 61, 62, 0.08);
  }

  .logo {
    width: 96px;
    height: 96px;
    object-fit: contain;
    margin-bottom: 20px;
  }

  .logo-fallback {
    width: 96px;
    height: 96px;
    margin: 0 auto 20px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--deep-teal), var(--leaf-green));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 40px;
    font-family: Georgia, serif;
  }

  h1 {
    font-size: 26px;
    margin: 0 0 6px;
    color: var(--deep-teal);
    letter-spacing: 0.2px;
  }

  .tagline {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(232, 121, 43, 0.1);
    color: var(--accent-orange);
    border: 1px solid rgba(232, 121, 43, 0.3);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.4px;
    margin-bottom: 32px;
  }

  .badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-orange);
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  .contact {
    text-align: left;
    display: grid;
    gap: 14px;
  }

  .contact-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .contact-row .icon {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    margin-top: 2px;
    color: var(--leaf-green);
  }

  .contact-row .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    margin: 0 0 2px;
  }

  .contact-row .value {
    font-size: 15px;
    color: var(--text);
    line-height: 1.4;
  }

  footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main class="card">
    <img src="assets/logo.png" alt="Ayansh Medical Hall logo" class="logo"
         onerror="this.replaceWith(Object.assign(document.createElement('div'), {className: 'logo-fallback', textContent: 'A'}))" />

    <h1>Ayansh Medical Hall</h1>

    <div class="badge"><span class="dot"></span>Website under construction</div>

    <div class="divider"></div>

    <div class="contact">
      <div class="contact-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <div>
          <p class="label">Address</p>
          <p class="value">01, Jagdishpur Road, Near Petrol Pump,<br />Baijani, Bhagalpur, Bihar&nbsp;-&nbsp;812005</p>
        </div>
      </div>
    </div>

    <footer>&copy; <span id="year"></span> Ayansh Medical Hall. All rights reserved.</footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
